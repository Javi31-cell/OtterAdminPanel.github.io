<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otter Studio · Administración</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0b0e;--s1:#11141b;--s2:#171b25;--bd:#1f2433;--tx:#ece8e3;--mu:#7d8497;--ac:#f97316;--ac2:#fbbf24;--ok:#22c55e;--in:#3b82f6;--er:#ef4444;--wa:#f59e0b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#2a160a 0%,transparent 60%),var(--bg);color:var(--tx);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#0c0e13;border-right:1px solid var(--bd);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;letter-spacing:.04em}
.logo small{display:block;color:var(--mu);font-weight:500;letter-spacing:.12em;font-size:10px}
nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:10px;padding:9px 12px;color:var(--mu);cursor:pointer;text-align:left}
nav button:hover{background:var(--s1);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,#2b1708,transparent);color:var(--ac2);box-shadow:inset 2px 0 var(--ac)}
.who{margin-top:auto;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--s1);font-size:12px;color:var(--mu)}
.who select{width:100%;margin-top:6px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:6px}
main{padding:26px 32px 60px;max-width:1200px;width:100%}
.demo{background:#2a1a08;border:1px solid #5c3a10;color:#fcd9a8;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:20px}
h1{margin:0 0 4px;font-size:24px}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 22px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat b{font-size:28px;display:block;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mu);font-size:12px}
.btn{border:1px solid var(--bd);background:var(--s2);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:#3a4258}.btn.p{background:linear-gradient(90deg,var(--ac),#ea580c);border:0;color:#fff;font-weight:700}
.btn.d:hover{border-color:var(--er);color:var(--er)}.btn:disabled{opacity:.35;cursor:not-allowed}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.bar .sp{flex:1}
input,select{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;outline:0}
input:focus,select:focus{border-color:var(--ac)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:620px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);text-align:left;padding:11px 14px;background:var(--s1)}
td{padding:11px 14px;border-top:1px solid var(--bd)}tr:hover td{background:#0f121a}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.t-ok{background:#12301e;color:var(--ok)}.t-in{background:#12233f;color:var(--in)}.t-er{background:#3a1515;color:var(--er)}.t-wa{background:#33260c;color:var(--wa)}.t-mu{background:#1d2130;color:var(--mu)}
code{background:var(--s2);padding:2px 7px;border-radius:6px;font-size:12px;color:var(--ac2)}
.inst{display:flex;gap:12px;align-items:center}.inst i{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#7c2d12,var(--ac));display:grid;place-items:center;font-style:normal;font-weight:800}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.row:first-of-type{border:0}
.pg{height:8px;background:var(--s2);border-radius:9px;overflow:hidden;margin:10px 0}.pg div{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(480px,92vw)}
dialog::backdrop{background:#000a}label{display:block;margin:12px 0 4px;color:var(--mu);font-size:12px}
label.c{display:flex;gap:8px;color:var(--tx);margin:6px 0}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;padding:20px}
#login .card{width:min(380px,100%);text-align:center}#login input{width:100%;margin-bottom:10px}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.logo{padding:4px}.who{display:none}main{padding:18px 14px}}
</style></head><body>
<div id="login"><div class="card">
 <svg width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#ea580c"/></linearGradient></defs><circle cx="32" cy="34" r="22" fill="url(#g)"/><circle cx="15" cy="17" r="6" fill="#ea580c"/><circle cx="49" cy="17" r="6" fill="#ea580c"/><circle cx="24" cy="30" r="3" fill="#2a1408"/><circle cx="40" cy="30" r="3" fill="#2a1408"/><ellipse cx="32" cy="39" rx="5" ry="3.5" fill="#2a1408"/><path d="M14 40h10M14 45l9-2M50 40H40M50 45l-9-2" stroke="#2a1408" stroke-width="1.6" stroke-linecap="round"/></svg>
 <h1 style="margin-top:8px">Otter Studio</h1><p class="sub">Panel de administración</p>
 <input id="lu" placeholder="Usuario" aria-label="Usuario" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password"><input id="lm" placeholder="Código de verificación (MFA)" aria-label="MFA" inputmode="numeric" autocomplete="one-time-code">
 <button class="btn p" style="width:100%" id="entrar" disabled>Entrar</button>
 <p id="err" style="color:var(--er);font-size:12px;margin:0 0 8px"></p>
 <p style="font-size:11px;color:#f97316;margin:14px 0 0;letter-spacing:.1em">PANEL v6</p>
 <p id="nota" class="sub" style="font-size:12px;margin:12px 0 0">Comprobando conexión con el servidor…</p>
</div></div>
<div class="app"><aside>
 <div class="logo"><svg width="30" height="30" viewBox="0 0 64 64"><circle cx="32" cy="34" r="24" fill="url(#g)"/><circle cx="24" cy="30" r="3" fill="#2a1408"/><circle cx="40" cy="30" r="3" fill="#2a1408"/><ellipse cx="32" cy="39" rx="5" ry="3.5" fill="#2a1408"/></svg><div>OTTER STUDIO<small>ADMINISTRACIÓN</small></div></div>
 <nav id="nav"></nav>
 <div class="who">Rol (para probar permisos)<select id="rol"><option>Propietario</option><option>Administrador</option><option>Desarrollador</option><option>Moderador</option></select></div>
</aside><main><div class="demo">● MODO DEMO · datos de ejemplo. Ningún cambio se guarda ni afecta a jugadores reales.</div><div id="v"></div></main></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={vista:"resumen",rol:"Propietario",q:"",
 inst:[{n:"World Of Clan Remake",v:"1.2.0",mc:"Forge 1.20.1",e:"disponible",j:182,f:"09/10/2026",nt:"Config de economía corregida"},{n:"Proyecto Aventura",v:"0.9.3",mc:"Forge 1.20.1",e:"actualizacion",j:64,f:"05/10/2026",nt:"Nuevos recursos"},{n:"Serie Invierno",v:"—",mc:"Forge 1.20.1",e:"proximamente",j:0,f:"—",nt:"En preparación"}],
 cod:[{c:"OTTER-7K2M-9QX4",i:["World Of Clan Remake"],ex:"2026-12-31",u:34,m:120,r:0},{c:"OTTER-B81F-ZP03",i:["World Of Clan Remake","Proyecto Aventura"],ex:"2026-11-15",u:5,m:10,r:0},{c:"OTTER-44AA-KQ7W",i:["Proyecto Aventura"],ex:"2026-09-30",u:20,m:20,r:1}],
 us:[{n:"JaviZK_1",f:"01/10/2026",e:"Activo",i:["World Of Clan Remake"]},{n:"NutriaFan",f:"03/10/2026",e:"Activo",i:["World Of Clan Remake","Proyecto Aventura"]},{n:"Castor_77",f:"06/10/2026",e:"Suspendido",i:[]},{n:"RioAzul",f:"08/10/2026",e:"Activo",i:["Proyecto Aventura"]}],
 ev:{n:"Evento de apertura",cap:120,listos:87,cola:41,abierto:false},
 au:[["09/10 21:14","Javi","Publicó World Of Clan Remake 1.2.0"],["09/10 20:02","Ana","Creó el código OTTER-B81F-ZP03"],["08/10 18:40","Javi","Revocó el código OTTER-44AA-KQ7W"],["07/10 12:11","Leo","Inició sesión (MFA verificado)"]]};
const P={Propietario:"*",Administrador:["codigo","revocar","publicar","cola","usuario"],Desarrollador:["publicar"],Moderador:["usuario"]};
const ok=a=>P[S.rol]==="*"||P[S.rol].includes(a);
const log=t=>S.au.unshift([new Date().toLocaleString("es",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),S.rol,t]);
const ET={disponible:["DISPONIBLE","t-ok"],actualizacion:["ACTUALIZACIÓN","t-in"],mantenimiento:["MANTENIMIENTO","t-er"],proximamente:["PRÓXIMAMENTE","t-wa"],oculto:["OCULTO","t-mu"]};
const tag=e=>`<span class="tag ${ET[e][1]}">${ET[e][0]}</span>`;
const NAV=[["resumen","◧ Resumen"],["instancias","▣ Instancias"],["codigos","⌗ Códigos de acceso"],["usuarios","☺ Usuarios"],["cola","⇅ Eventos y cola"],["auditoria","☰ Auditoría"]];
function nav(){$("#nav").innerHTML=NAV.map(([k,t])=>`<button data-v="${k}" class="${S.vista===k?"on":""}">${t}</button>`).join("")}
const dis=a=>ok(a)?"":" disabled title='Tu rol no tiene este permiso (el servidor también lo comprueba)'";
const V={
resumen:()=>`<h1>Resumen</h1><p class="sub">Estado general de la plataforma.</p>
<div class="grid g4"><div class="card stat"><b>${S.us.length*312}</b><span>Jugadores registrados</span></div><div class="card stat"><b>${S.cod.filter(c=>!c.r).length}</b><span>Códigos activos</span></div><div class="card stat"><b>${S.inst.filter(i=>i.e!=="proximamente").length}</b><span>Instancias publicadas</span></div><div class="card stat"><b>2</b><span>Errores de lanzamiento (24 h)</span></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Actividad reciente</h2>${S.au.slice(0,5).map(a=>`<div class="row"><span>${esc(a[2])}</span><span style="color:var(--mu)">${esc(a[0])}</span></div>`).join("")}</div>
<div class="card"><h2>Próximo evento</h2><b>${esc(S.ev.n)}</b><div class="pg"><div style="width:${S.ev.listos/S.ev.cap*100}%"></div></div><span style="color:var(--mu)">${S.ev.listos}/${S.ev.cap} jugadores preparados · ${S.ev.cola} en cola</span></div></div>`,
instancias:()=>`<div class="bar"><div><h1>Instancias</h1><p class="sub" style="margin:0">Proyectos, versiones y estado.</p></div><span class="sp"></span><button class="btn p" data-a="nuevaInst"${dis("publicar")}>＋ Nueva instancia</button></div>
<div class="tw"><table><tr><th>Proyecto</th><th>Versión</th><th>Estado</th><th>Jugadores</th><th>Última actualización</th><th></th></tr>${S.inst.map((i,k)=>`<tr><td><div class="inst"><i>${esc(i.n[0])}</i><div><b>${esc(i.n)}</b><br><span style="color:var(--mu)">${esc(i.mc)}</span></div></div></td><td><code>${esc(i.v)}</code></td><td>${tag(i.e)}</td><td>${i.j}</td><td>${esc(i.f)}<br><span style="color:var(--mu)">${esc(i.nt)}</span></td><td><button class="btn" data-a="estado" data-k="${k}"${dis("publicar")}>Estado</button> <button class="btn" data-a="editar" data-k="${k}"${dis("publicar")}>Editar</button> <button class="btn" data-a="publicar" data-k="${k}"${dis("publicar")}>Publicar</button> <button class="btn d" data-a="revertir" data-k="${k}"${dis("publicar")}>Revertir</button></td></tr>`).join("")}</table></div>`,
codigos:()=>`<div class="bar"><div><h1>Códigos de acceso</h1><p class="sub" style="margin:0">Crea, limita y revoca códigos.</p></div><span class="sp"></span><button class="btn p" data-a="nuevoCod"${dis("codigo")}>＋ Nuevo código</button></div>
<div class="tw"><table><tr><th>Código</th><th>Instancias</th><th>Caduca</th><th>Usos</th><th>Estado</th><th></th></tr>${S.cod.map((c,k)=>`<tr><td><code>${esc(c.c)}</code></td><td>${c.i.map(esc).join(", ")}</td><td>${esc(c.ex)}</td><td>${c.u}/${c.m}</td><td>${c.r?'<span class="tag t-er">REVOCADO</span>':c.u>=c.m?'<span class="tag t-mu">AGOTADO</span>':'<span class="tag t-ok">ACTIVO</span>'}</td><td><button class="btn d" data-a="revCod" data-k="${k}"${c.r?" disabled":dis("revocar")}>Revocar</button></td></tr>`).join("")}</table></div>`,
usuarios:()=>`<div class="bar"><div><h1>Usuarios</h1><p class="sub" style="margin:0">Busca por nombre o identificador.</p></div><span class="sp"></span><input id="q" placeholder="Buscar usuario…" value="${esc(S.q)}"></div>
<div class="tw"><table><tr><th>Usuario</th><th>Registro</th><th>Estado</th><th>Instancias autorizadas</th><th></th></tr>${S.us.filter(u=>u.n.toLowerCase().includes(S.q.toLowerCase())).map(u=>{const k=S.us.indexOf(u);return`<tr><td><b>${esc(u.n)}</b></td><td>${esc(u.f)}</td><td><span class="tag ${u.e==="Activo"?"t-ok":"t-er"}">${esc(u.e)}</span></td><td>${u.i.length?u.i.map(esc).join(", "):'<span style="color:var(--mu)">Ninguna</span>'}</td><td><button class="btn" data-a="recup" data-k="${k}"${dis("usuario")}>Recuperar cuenta</button> <button class="btn d" data-a="susp" data-k="${k}"${dis("usuario")}>${u.e==="Activo"?"Revocar acceso":"Restaurar"}</button></td></tr>`}).join("")}</table></div>`,
cola:()=>{const e=S.ev;return`<h1>Eventos y cola</h1><p class="sub">Acceso controlado a eventos con aforo.</p><div class="card" style="max-width:640px"><div class="bar"><h2 style="margin:0">${esc(e.n)}</h2><span class="sp"></span><span class="tag ${e.abierto?"t-ok":"t-wa"}">${e.abierto?"ACCESO ABIERTO":"EN ESPERA"}</span></div>
<div class="pg"><div style="width:${e.listos/e.cap*100}%"></div></div><div class="row"><span>Jugadores requeridos</span><b>${e.cap}</b></div><div class="row"><span>Preparados</span><b>${e.listos}</b></div><div class="row"><span>En cola</span><b>${e.cola}</b></div>
<div class="bar" style="margin:16px 0 0"><button class="btn p" data-a="abrir"${dis("cola")}>${e.abierto?"Cerrar acceso":"Abrir acceso"}</button><button class="btn" data-a="saltar"${dis("cola")}>Saltar cola (admin)</button></div></div>`},
auditoria:()=>`<h1>Auditoría</h1><p class="sub">Registro de acciones administrativas.</p><div class="tw"><table><tr><th>Fecha</th><th>Quién</th><th>Acción</th></tr>${S.au.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2])}</td></tr>`).join("")}</table></div>`};
function draw(){nav();$("#v").innerHTML=V[S.vista]();const q=$("#q");if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
const dlg=$("#dlg"),open=h=>{dlg.innerHTML=h;dlg.showModal()};
const dlgEditar=k=>{const i=S.inst[k];open(`<h2>Editar ${esc(i.n)}</h2><label>Nombre</label><input id="f1" maxlength="60" value="${esc(i.n)}"><label>Versión de Minecraft</label><input id="f2" value="${esc(i.mc)}"><label>Descripción (se ve en la tarjeta del launcher)</label><input id="f3" maxlength="200" value="${esc(i.d||"")}"><label>Banner (PNG o JPG; se ajusta solo)</label><input id="fb" type="file" accept="image/png,image/jpeg"><div class="bar" style="margin-top:18px"><span class="sp"></span><button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn p" data-a="guardaEditar" data-k="${k}">Guardar</button></div>`)};
const leerBanner=f=>new Promise((ok,no)=>{if(!f)return ok("");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=580;c.height=280;const g=c.getContext("2d"),s=Math.max(580/im.width,280/im.height),w=im.width*s,h=im.height*s;g.drawImage(im,(580-w)/2,(280-h)/2,w,h);ok(c.toDataURL("image/jpeg",.85))};im.onerror=()=>no(new Error("No se pudo leer la imagen."));im.src=r.result};r.onerror=()=>no(new Error("No se pudo leer el archivo."));r.readAsDataURL(f)});
const dlgEstado=k=>{const i=S.inst[k];open(`<h2>Estado de ${esc(i.n)}</h2><label>Estado</label><select id="f1">${Object.entries(ET).map(([v,[t]])=>`<option value="${v}"${v===i.e?" selected":""}>${t}</option>`).join("")}</select><label>Mensaje para los jugadores (opcional)</label><input id="f2" maxlength="140" value="${esc(i.m||"")}" placeholder="Ej.: Volvemos a las 20:00"><div class="bar" style="margin-top:18px"><span class="sp"></span><button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn p" data-a="guardaEstado" data-k="${k}">Guardar</button></div>`)};
const A={editar:dlgEditar,guardaEditar:k=>{const i=S.inst[k];i.n=$("#f1").value||i.n;i.mc=$("#f2").value;i.d=$("#f3").value;log("Editó la instancia "+i.n);dlg.close();draw()},estado:dlgEstado,guardaEstado:k=>{const i=S.inst[k];i.e=$("#f1").value;i.m=$("#f2").value;log(`Cambió el estado de ${i.n} a ${ET[i.e][0]}`);dlg.close();draw()},nuevaInst:()=>open(`<h2>Nueva instancia</h2><label>Nombre</label><input id="f1" placeholder="Nombre del proyecto"><label>Versión de Minecraft</label><input id="f2" value="Forge 1.20.1"><label>Descripción</label><input id="f3" placeholder="Descripción breve"><div class="bar" style="margin-top:18px"><span class="sp"></span><button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn p" data-a="creaInst">Crear</button></div>`),
creaInst:()=>{const n=$("#f1").value.trim();if(!n)return;S.inst.push({n,v:"—",mc:$("#f2").value,e:"proximamente",j:0,f:"—",nt:$("#f3").value});log("Creó la instancia "+n);dlg.close();draw()},
nuevoCod:()=>open(`<h2>Nuevo código</h2><label>Instancias</label>${S.inst.map((i,k)=>`<label class="c"><input type="checkbox" value="${k}"> ${esc(i.n)}</label>`).join("")}<label>Caduca el</label><input id="f1" type="date" value="2026-12-31"><label>Usos máximos</label><input id="f2" type="number" min="1" value="10"><div class="bar" style="margin-top:18px"><span class="sp"></span><button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn p" data-a="creaCod">Generar</button></div>`),
creaCod:()=>{const i=[...dlg.querySelectorAll("input[type=checkbox]:checked")].map(x=>S.inst[x.value].n);if(!i.length)return;const r=crypto.getRandomValues(new Uint8Array(8)),a="ABCDEFGHJKMNPQRSTUVWXYZ23456789",g=n=>[...r.slice(n,n+4)].map(b=>a[b%a.length]).join(""),c=`OTTER-${g(0)}-${g(4)}`;S.cod.unshift({c,i,ex:$("#f1").value,u:0,m:+$("#f2").value||1,r:0});log("Creó el código "+c);dlg.close();draw()},
revCod:k=>{S.cod[k].r=1;log("Revocó el código "+S.cod[k].c);draw()},
publicar:k=>{const i=S.inst[k];i.v=i.v==="—"?"1.0.0":i.v.replace(/\d+$/,x=>+x+1);i.e="disponible";i.f="hoy";log(`Publicó ${i.n} ${i.v}`);draw()},
revertir:k=>{log("Revirtió "+S.inst[k].n+" a la versión anterior");alert("Demo: aquí se vuelve al manifiesto anterior y los jugadores se sincronizan solos.")},
recup:k=>{log("Inició la recuperación de "+S.us[k].n);alert("Demo: se enviaría un enlace seguro para que el usuario verifique que es el propietario y fije una contraseña nueva. Nadie puede ver su contraseña.")},
susp:k=>{const u=S.us[k];u.e=u.e==="Activo"?"Suspendido":"Activo";log(`${u.e==="Activo"?"Restauró":"Revocó"} el acceso de ${u.n}`);draw()},
abrir:()=>{S.ev.abierto=!S.ev.abierto;log((S.ev.abierto?"Abrió":"Cerró")+" el acceso a "+S.ev.n);draw()},
saltar:()=>{log("Se saltó la cola (permiso verificado en el servidor)");alert("Demo: el servidor comprueba el permiso; un botón local no basta.")}};
let REAL=false;
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json","X-Otter":"1"},body:b?JSON.stringify(b):undefined,credentials:"same-origin"});let j={};try{j=await r.json()}catch(e){}if(r.status===401&&REAL&&S.yo)location.reload();if(!r.ok)throw new Error(j.error||"Error "+r.status);return j}
async function cargar(){const d=await api("GET","/api/estado");Object.assign(S,{inst:d.inst,cod:d.cod,us:d.us,ev:d.ev,au:d.au,rol:d.yo.rol,yo:d.yo.usuario});$("#rol").innerHTML=`<option>${esc(S.rol)}</option>`;$("#rol").disabled=true;$(".who").childNodes[0].textContent="Sesión de "+S.yo+" · rol"}
const rec=async()=>{await cargar();draw()};
const AR={
guardaEditar:async k=>{const i=S.inst[k];const b=await leerBanner($("#fb").files[0]);await api("POST","/api/instancias/editar",{id:i.id,nombre:$("#f1").value,mc:$("#f2").value,descripcion:$("#f3").value,banner:b});dlg.close();await rec()},
guardaEstado:async k=>{await api("POST","/api/instancias/estado",{id:S.inst[k].id,estado:$("#f1").value,mensaje:$("#f2").value});dlg.close();await rec()},
creaInst:async()=>{const n=$("#f1").value.trim();if(!n)return;await api("POST","/api/instancias",{nombre:n,mc:$("#f2").value,descripcion:$("#f3").value});dlg.close();await rec()},
creaCod:async()=>{const i=[...dlg.querySelectorAll("input[type=checkbox]:checked")].map(x=>S.inst[x.value].id);if(!i.length)return;const r=await api("POST","/api/codigos",{instancias:i,expira:$("#f1").value,max:+$("#f2").value||1});dlg.close();await rec();alert("Código creado: "+r.codigo)},
revCod:async k=>{await api("POST","/api/codigos/revocar",{codigo:S.cod[k].c});await rec()},
publicar:async k=>{const r=await api("POST","/api/instancias/publicar",{id:S.inst[k].id});await rec();alert("Publicada la versión "+r.version)},
revertir:async k=>{const r=await api("POST","/api/instancias/revertir",{id:S.inst[k].id});await rec();alert("Ahora la versión oficial es la "+r.version+". Los jugadores se sincronizarán solos.")},
recup:async k=>{const r=await api("POST","/api/usuarios/recuperar",{usuario:S.us[k].n});alert("Código de recuperación para "+S.us[k].n+" (válido 30 min, un solo uso):\n\n"+r.codigo+"\n\nEntrégaselo por un canal seguro.")},
susp:async k=>{await api("POST","/api/usuarios/estado",{usuario:S.us[k].n});await rec()},
abrir:async()=>{await api("POST","/api/cola/abrir");await rec()},
saltar:async()=>{const r=await api("POST","/api/cola/saltar");await rec();alert("Pase de administrador (válido 5 min):\n"+r.pase)}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a],[data-v]");if(!b||b.disabled)return;if(b.dataset.v){S.vista=b.dataset.v;draw()}else{const f=(REAL&&AR[b.dataset.a])||A[b.dataset.a];Promise.resolve(f(b.dataset.k)).catch(x=>alert(x.message))}});
$("#rol").onchange=e=>{S.rol=e.target.value;draw()};
$("#entrar").onclick=async()=>{if(!REAL){$("#login").remove();draw();return}try{await api("POST","/api/login",{usuario:$("#lu").value,clave:$("#lp").value,codigo:$("#lm").value});await cargar();$("#lp").value="";$("#login").remove();draw()}catch(x){$("#err").textContent=x.message}};
["lu","lp","lm"].forEach(i=>$("#"+i).addEventListener("keydown",e=>{if(e.key==="Enter")$("#entrar").click()}));
(async()=>{try{const r=await fetch("/api/estado",{credentials:"same-origin",headers:{"X-Otter":"1"}});if(r.status===401||r.ok){REAL=true;S.inst=[];S.cod=[];S.us=[];S.au=[];$(".demo").remove();$("#entrar").disabled=false;$("#nota").textContent="Acceso protegido con contraseña y verificación en dos pasos.";try{const cf=await(await fetch("/api/config")).json();if(!cf.mfa)$("#lm").style.display="none"}catch(e){}if(r.ok){await cargar();$("#login").remove();draw()}}}catch(e){}if(!REAL){$(".demo").remove();$("#err").textContent="No se pudo conectar con el servidor de Otter Studio.";$("#nota").textContent="Arranca el servidor (python servidor_otter.py ejecutar) y abre esta página desde http://127.0.0.1:8750 en vez de abrir el archivo."}})();
setInterval(()=>{if(REAL&&S.yo&&S.vista==="cola"&&!dlg.open)rec().catch(()=>{})},5000);
</script></body></html>
